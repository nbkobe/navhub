// ====== 分类配置 ======
const categories = {
    chat:   { title:"智能对话", icon:"💬", color:"var(--accent-blue)" },
    image:  { title:"AI 绘画", icon:"🎨", color:"var(--accent-purple)" },
    video:  { title:"AI 视频", icon:"🎬", color:"var(--accent-orange)" },
    writing:{ title:"AI 写作", icon:"✍️", color:"var(--accent-green)" },
    code:   { title:"编程开发", icon:"💻", color:"var(--accent-cyan)" },
    office: { title:"办公效率", icon:"📊", color:"var(--accent-yellow)" },
    audio:  { title:"音频音乐", icon:"🎵", color:"var(--accent-pink)" },
    search: { title:"AI 搜索", icon:"🔍", color:"var(--accent-red)" },
};

// ====== 渲染 ======
const contentEl = document.getElementById('content');
const noResults = document.getElementById('noResults');
let currentCat = 'all';
let currentSearch = '';

function getTagHTML(tag) {
    const map = { '免费':'tag-free', '热门':'tag-hot', '新':'tag-new', '付费':'tag-pro', '开源':'tag-free' };
    return `<span class="tag ${map[tag]||'tag-free'}">${tag}</span>`;
}

function render() {
    let filtered = tools.filter(t => {
        const matchCat = currentCat === 'all' || t.cat === currentCat;
        const q = currentSearch.toLowerCase();
        const matchSearch = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.maker.toLowerCase().includes(q) || t.cat.includes(q);
        return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
        contentEl.innerHTML = '';
        noResults.style.display = 'block';
        return;
    }
    noResults.style.display = 'none';

    // Group by category
    const grouped = {};
    filtered.forEach(t => {
        if (!grouped[t.cat]) grouped[t.cat] = [];
        grouped[t.cat].push(t);
    });

    let html = '';
    const catOrder = ['chat','image','video','writing','code','office','audio','search'];
    catOrder.forEach(cat => {
        if (!grouped[cat]) return;
        const c = categories[cat];
        html += `<div class="section">
            <div class="section-header">
                <span class="section-icon">${c.icon}</span>
                <span class="section-title">${c.title}</span>
                <span class="section-count">${grouped[cat].length} 个工具</span>
            </div>
            <div class="cards">`;
        grouped[cat].forEach(t => {
            html += `<a class="card" href="${t.href}" target="_blank" rel="noopener">
                <div class="card-top">
                    <div class="card-logo" style="background:${t.bg}">${t.icon}</div>
                    <div class="card-info">
                        <div class="card-name">${t.name}</div>
                        <div class="card-maker">${t.maker}</div>
                    </div>
                </div>
                <div class="card-desc">${t.desc}</div>
                <div class="card-bottom">
                    <div class="card-tags">${t.tags.map(getTagHTML).join('')}</div>
                    <button class="card-btn">立即体验 →</button>
                </div>
            </a>`;
        });
        html += `</div></div>`;
    });
    contentEl.innerHTML = html;
}

// ====== Events ======
document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    render();
});

document.getElementById('searchInput').addEventListener('input', e => {
    currentSearch = e.target.value.trim();
    render();
});

// Initial render
render();
</script>
