<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavHub - AI工具导航站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        header { text-align: center; padding: 60px 20px 30px; }
        header h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        header p { color: #64748b; font-size: 1.1rem; }
        .search-box { max-width: 500px; margin: 25px auto 0; }
        .search-box input {
            width: 100%; padding: 14px 20px;
            border: 1px solid #334155; border-radius: 12px;
            background: #1e293b; color: #e2e8f0; font-size: 1rem; outline: none;
        }
        .search-box input:focus { border-color: #38bdf8; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .category-title { font-size: 1.3rem; color: #38bdf8; margin: 30px 0 15px; padding-bottom: 8px; border-bottom: 1px solid #1e293b; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .card {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 20px; text-decoration: none; color: inherit;
            transition: all 0.2s; display: block;
        }
        .card:hover { border-color: #38bdf8; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,0.1); }
        .card .icon { font-size: 2rem; margin-bottom: 10px; }
        .card h3 { font-size: 1.05rem; margin-bottom: 6px; color: #f1f5f9; }
        .card p { font-size: 0.85rem; color: #64748b; line-height: 1.5; }
        .card .badge { display: inline-block; background: #7c3aed; color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-top: 8px; }
        .submit-btn { text-align: center; padding: 50px 20px; margin-top: 40px; border-top: 1px solid #1e293b; }
        .submit-btn a { display: inline-block; padding: 12px 32px; background: linear-gradient(135deg, #38bdf8, #a78bfa); color: white; border-radius: 8px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <h1>🚀 NavHub</h1>
        <p>精选AI工具，提升10倍效率</p>
        <div class="search-box">
            <input type="text" placeholder="搜索AI工具..." id="searchInput" onkeyup="filterCards()">
        </div>
    </header>
    <div class="container">
        <h2 class="category-title">🎨 AI 绘画</h2>
        <div class="grid">
            <a href="https://cakegrowth.cn" target="_blank" class="card">
                <div class="icon">🖼️</div>
                <h3>即梦AI</h3>
                <p>字节跳动出品，中文最好用的AI绘画工具</p>
                <span class="badge">免费使用</span>
            </a>
            <a href="https://cakegrowth.cn" target="_blank" class="card">
                <div class="icon">✨</div>
                <h3>星流AI</h3>
                <p>高质量AI图像生成，商业级素材产出</p>
                <span class="badge">注册送积分</span>
            </a>
        </div>
        <h2 class="category-title">📊 AI 办公</h2>
        <div class="grid">
            <a href="https://cakegrowth.cn" target="_blank" class="card">
                <div class="icon">📝</div>
                <h3>讯飞绘文</h3>
                <p>AI图文创作+多平台一键分发</p>
                <span class="badge">高效写作</span>
            </a>
            <a href="https://cakegrowth.cn" target="_blank" class="card">
                <div class="icon">📐</div>
                <h3>iSlide PPT</h3>
                <p>AI一键生成精美PPT演示文稿</p>
                <span class="badge">职场必备</span>
            </a>
        </div>
        <h2 class="category-title">🎬 AI 视频</h2>
        <div class="grid">
            <a href="https://cakegrowth.cn" target="_blank" class="card">
                <div class="icon">🎥</div>
                <h3>墨刀AI</h3>
                <p>AI视频创作与原型设计一体化</p>
                <span class="badge">创作者推荐</span>
            </a>
        </div>
        <div class="submit-btn">
            <p style="color:#64748b; margin-bottom:15px;">有好用的AI工具？推荐给大家</p>
            <a href="mailto:admin@navhub.cc?subject=NavHub工具收录申请">📬 提交工具收录</a>
        </div>
    </div>
    <script>
        function filterCards() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(keyword) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
