<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI NAV HUB · 赛博千里江山</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="landscape"></canvas>

<nav class="top-nav">
  <div class="nav-brand">
    <span class="brand-icon">⚡</span>
    <span class="brand-text">AI NAV HUB</span>
  </div>
  <div class="nav-links">
    <a href="#tools" class="nav-link active">工具库</a>
    <a href="#news" class="nav-link">AI资讯</a>
    <a href="#about" class="nav-link">关于</a>
  </div>
</nav>

<header class="hero">
  <h1 class="hero-title">
    <span class="title-line">赛博导航</span>
    <span class="title-line highlight">全球AI工具集</span>
  </h1>
  <p class="hero-sub">收录全球精选AI工具 · 实时追踪行业前沿</p>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="搜索AI工具、功能、关键词..." oninput="filterTools()">
    <span class="search-icon">🔍</span>
  </div>
</header>

<main class="content" id="tools">

  <!-- AI资讯实时频道 -->
  <section class="news-section" id="news">
    <div class="section-header">
      <span class="section-dot"></span>
      <h2 class="section-title">AI 实时资讯</h2>
      <span class="live-badge">LIVE</span>
      <button class="refresh-btn" onclick="loadNews()">↻ 刷新</button>
    </div>
    <div class="news-grid" id="newsGrid">
      <div class="news-loading">正在获取最新AI资讯...</div>
    </div>
  </section>

  <!-- 工具分类区域由JS动态渲染 -->
  <div id="toolSections"></div>

</main>

<footer>
  <p>AI NAV HUB © 2026 · 持续收录全球优质AI工具</p>
  <p class="footer-sub">数据驱动 · 实时更新 · 开放共享</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
